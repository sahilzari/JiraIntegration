name: Build EXE and Push to Release Repo

on:
  push:
    paths:
      - "**.py"   # Trigger only when Python files change

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile main.py

      - name: Push EXE to Release Repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://x-access-token:${{ secrets.RELEASE_REPO_TOKEN }}@github.com/sahilzari/JiraIntRlease.git
          cp dist/main.exe JiraIntRlease/
          cd JiraIntRlease
          git add .
          git commit -m "Release new exe build from latest Python code"
          git push origin main